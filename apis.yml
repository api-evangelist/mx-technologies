- Data Enhancement
- FDX
- Account Verification
- Personal Finance
apis:
- name: MX Atrium API
  description: >
    The legacy MX financial data connectivity API supporting over 48,000 data connections to thousands
    of financial institutions. Provides secure access to user accounts and transactions with industry-leading
    cleansing, categorization, and classification. Available for existing integrations.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.mx.com/api-reference/atrium/
  baseURL: https://atrium.mx.com
  tags:
  - Account Aggregation
  - Legacy
  - Transactions
  - Financial Data
  properties:
  - type: Documentation
    url: https://docs.mx.com/api-reference/atrium/
- name: MX SSO API
  description: >
    A RESTful authentication API used to authenticate users on the MX Platform and generate widget URLs
    for Personal Finance Management and Financial Insights widgets. Supports both XML and JSON encoding.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.mx.com/api-reference/sso/v3/
  baseURL: https://api.mx.com
  tags:
  - Authentication
  - SSO
  - Widgets
  properties:
  - type: Documentation
    url: https://docs.mx.com/api-reference/sso/v3/
- name: MX Data Access API
  description: >
    An open finance API built to FDX standards enabling permissioned data sharing with consumer consent
    management. Supports Account Owner Identity, statements, transaction history, account verifications,
    and OAuth-based data sharing. Processes over 500K connections with 70% through OAuth APIs.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.mx.com/products/data/data-access/
  baseURL: https://api.mx.com
  tags:
  - Open Banking
  - FDX
  - OAuth
  - Data Sharing
  - Account Verification
  properties:
  - type: Documentation
    url: https://docs.mx.com/products/data/data-access/
- name: MX Batch API
  description: >
    Enables processing of bulk operations and batch requests on the MX platform, supporting large-scale
    data operations for financial institutions and fintech partners.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.mx.com/
  baseURL: https://api.mx.com
  tags:
  - Batch Processing
