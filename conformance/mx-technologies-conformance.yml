    name: Financial Data Exchange (FDX) API
    conforms: true
    evidence: >-
      Data Access shares/consumes institution data using FDX standards; Consent
      Management version parameter indicates the FDX version in use.
  - id: oauth2
    name: OAuth 2.0
    conforms: true
    evidence: >-
      Institution connections and Data Access use OAuth for tokenized,
