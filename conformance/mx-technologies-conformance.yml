notes: >-
  Standards conformance for MX. Data Access is positioned as FDX-conformant,
  consumer-permissioned, tokenized data sharing; the Consent Management API
  versions map to FDX versions. The Platform API uses HTTP Basic (no OAuth2
  securityScheme in the spec), so OAuth2/OIDC are asserted at the institution
  connection layer, not the API-authorization layer. Compliance certifications
  (SOC 2, PCI DSS) are captured in security/mx-trust-center.yml.
standards:
