  - id: http-basic-auth
    name: HTTP Basic Authentication (RFC 7617)
    conforms: true
    evidence: openapi securityScheme type http scheme basic (client_id / api_key)
  - id: rfc9116-security-txt
    name: security.txt (RFC 9116)
    conforms: true
    evidence: PGP-signed /.well-known/security.txt published at mx.com
  - id: rfc9457-problem-details
    name: RFC 9457 Problem Details
    conforms: false
