method: searched
source: https://docs.mx.com/connect
notes: >-
  MX ships embeddable, client-side UI surfaces (widgets) that load MX-hosted
  experiences in an iframe/webview, distinct from the server-side SDKs in
  packages/. The Connect Widget is the marquee account-connection flow; MoneyMap
  and other widgets are loaded via the same SDKs.
families:
  - name: Connect Widget
    detail: >-
      MX-hosted account-connection experience (institution search, credential /
      OAuth entry, MFA) embedded via iframe or webview and driven by postMessage
      events.
    docs: https://docs.mx.com/connect
  - name: MX Widgets (Money Map, Finances, etc.)
    detail: >-
      Prebuilt personal-finance widgets loaded by URL (Request Widget URL) and
      configured via deep_link_params.
