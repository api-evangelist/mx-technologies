generated: '2026-07-23'
method: searched
source: https://docs.mx.com/resources/webhooks/index
spec_type: Webhooks
notes: >-
  MX delivers events as HTTPS POST callbacks to a URL you configure per event
  (subscribe via the Client Dashboard; some webhooks are available only on
  request to MX Support). MX publishes no AsyncAPI document, so this artifact
  captures the webhook catalog. Payloads are JSON; object-based webhooks (e.g.
  Members, Transactions) carry a `revision` field for de-duplication and an
  `action` field (created / updated / deleted). Mutating API operations accept
  MX-Skip-Webhook to suppress emission. Recommended ack is 204 No Content;
  return 429 to have MX re-queue delivery.
transport: https-post-callback
subscription:
  mechanism: Client Dashboard (Developers > Webhooks); some require MX Support request
  per_event_url: true
delivery:
  ack_success: 204 No Content
  requeue_status: 429 Too Many Requests
  retries: Frequency of retries diminishes over time.
common_fields:
  action: [created, updated, deleted]
  revision: Incrementing integer on object-based webhooks for de-duplication.
